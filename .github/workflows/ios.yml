name: ios

on:
  workflow_dispatch:
  # Twice a week, restore the build-tree cache so GitHub does not evict it: an
  # entry unused for seven days is dropped, and rebuilding it costs the two hours
  # this cache exists to avoid. Nothing is compiled -- the job only restores.
  schedule:
    - cron: '17 3 * * 1,4'
  push:
    branches: [main]
    paths:
      - 'app/ios/**'
      - 'tooling/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'app/ios/**'
      - 'tooling/ios/**'
      - '.github/workflows/ios.yml'

# A cold engine build compiles V8 twice and takes about two hours on a 3-core
# runner. Cancelling it on every push would throw that away *and* lose the build
# tree it was going to cache, so a push waits its turn instead: the running build
# finishes, caches its tree, and the queued one starts warm.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Reading the cache list back after a save, so a silently failed save (the
  # action continues on error) is reported on the run page instead of being
  # discovered two hours into the next build.
  actions: read

jobs:
  # What the device build links and serves. Both halves are reproducible from
  # prepare-engine.sh, so they are cached under a key that moves when the script
  # or the lockfile moves; the unpacked Node source tree and its objects stay in
  # the runner's temp directory and are never cached.
  engine:
    name: engine (Node for iOS, harness)
    runs-on: macos-15
    # A cold cross-build compiles all of V8 twice (host snapshot tools, then the
    # target) and took just over two hours on a 3-core runner: the first attempt
    # was killed at 120 minutes while still inside v8_initializers. Warm runs hit
    # the staged-engine cache and take seconds, so the ceiling only has to cover
    # the cold case, and the wall clock is cheaper than a bigger runner.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      # The iOS copy of the `standard` preset is generated from the shipped one;
      # this is the only thing that notices when the shipped preset moves and the
      # copy would silently drift back to mounting tools a phone cannot run.
      - name: Check the generated preset override
        run: tooling/ios/make-ios-preset.py --check
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Restore a staged engine
        id: staged
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Vendor
            app/ios/Engine/runtime
          key: ios-engine-${{ runner.os }}-${{ hashFiles('tooling/ios/prepare-engine.sh', 'pnpm-lock.yaml') }}
      # The unpacked tree and its objects are the expensive part: a cold build
      # compiles V8 twice and runs about two hours. Keeping them means a retry
      # after a failure in a later step resumes instead of starting over.
      #
      # The key hashes exactly one file, tooling/ios/tree-cache-key, and nothing
      # else: a person writes in it what a bump means (a Node version move, a new
      # staging layout). It deliberately does NOT hash prepare-engine.sh -- most
      # edits to that file are in the staging half and leave every object valid --
      # and it does NOT hash the patches either. `prepare-engine.sh` decides for
      # itself whether a restored tree may be reused: it reads the stamp the tree
      # carries (`out/.dpsk-ios-tree`: wrapper version + patch set), reuses the
      # objects when the wrapper matches, puts back the pristine sources when the
      # patch set changed, and discards the tree only when the wrapper moved.
      # So a patch edit costs a few seconds of `make`, never two hours.
      - name: Restore the Node build tree
        id: tree
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/node-build
          key: node-tree-${{ runner.os }}-${{ hashFiles('tooling/ios/tree-cache-key') }}-${{ github.run_id }}
          restore-keys: |
            node-tree-${{ runner.os }}-${{ hashFiles('tooling/ios/tree-cache-key') }}-
      - name: Build Node for iOS and deploy the harness
        if: steps.staged.outputs.cache-hit != 'true'
        env:
          NODE_BUILD_DIR: ${{ runner.temp }}/node-build
        run: |
          set -o pipefail
          tooling/ios/prepare-engine.sh 2>&1 | tee "$RUNNER_TEMP/engine.log"
      # Saved even when the job fails: that is the case this cache exists for.
      - name: Keep the build tree for the next attempt
        if: always() && steps.staged.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/node-build
          key: node-tree-${{ runner.os }}-${{ hashFiles('tooling/ios/tree-cache-key') }}-${{ github.run_id }}
      # That save continues on error, so a failed upload would stay invisible
      # until the next build paid for two hours of V8 again. Ask the API whether
      # the key is really there and put the answer on the run page.
      - name: Check that the build tree was saved
        if: always() && steps.staged.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          key="node-tree-${{ runner.os }}-${{ hashFiles('tooling/ios/tree-cache-key') }}-${{ github.run_id }}"
          if gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
               --jq '.actions_caches[].key' | grep -qxF "$key"; then
            echo "the build tree is cached as $key"
          else
            echo "::warning title=tree cache::the build tree was not saved as $key — the next run pays for a cold build"
          fi
      # The job log needs a sign-in to read; annotations show on the run page
      # itself. A failed cross-build is diagnosed from the last screenful.
      - name: Leave the tail of a failed build on the run page
        if: failure() && steps.staged.outputs.cache-hit != 'true'
        run: |
          tail -n 60 "$RUNNER_TEMP/engine.log" >> "$GITHUB_STEP_SUMMARY" || true
          # One annotation shows only its first line, so the tail goes up in
          # short chunks instead: the last 3 KB of the log, ten displayed lines.
          tail -c 3000 "$RUNNER_TEMP/engine.log" 2>/dev/null \
            | tr '\r' '\n' | tr -d '\t' \
            | awk '{gsub(/%/,"%25"); printf "%s | ", $0}' \
            | fold -w 180 | tail -n 10 \
            | sed 's/^/::error::engine log: /' || true

  ipa:
    name: unsigned ipa
    needs: engine
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Restore the staged engine
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Vendor
            app/ios/Engine/runtime
          key: ios-engine-${{ runner.os }}-${{ hashFiles('tooling/ios/prepare-engine.sh', 'pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - name: Build unsigned ipa
        run: tooling/ios/build.sh iphoneos "$RUNNER_TEMP/ipa"
      - name: Upload the ipa
        uses: actions/upload-artifact@v4
        with:
          name: dpsk-unsigned-ipa
          path: ${{ runner.temp }}/ipa/DPSK.ipa
          if-no-files-found: error
          retention-days: 14

  # GitHub evicts a cache entry that nothing has read in seven days, which would
  # hand the next device build a cold tree. This job restores it twice a week and
  # compiles nothing: a restore counts as use.
  warm:
    name: keep the build tree cache warm
    if: github.event_name == 'schedule'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore the build tree
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/node-build
          key: node-tree-warm-${{ github.run_id }}
          restore-keys: |
            node-tree-${{ runner.os }}-${{ hashFiles('tooling/ios/tree-cache-key') }}-
      - name: Report what the next build will start from
        run: |
          if [ -d "$RUNNER_TEMP/node-build" ]; then
            echo "restored $(du -sh "$RUNNER_TEMP/node-build" | cut -f1)"
            find "$RUNNER_TEMP/node-build" -maxdepth 1 -type d -name 'node-*' -print
          else
            echo "::warning title=tree cache::nothing to restore — the next device build is cold"
          fi
