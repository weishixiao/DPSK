name: ios

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/ios/**'
      - 'tooling/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'app/ios/**'
      - 'tooling/ios/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What the device build links and serves. Both halves are reproducible from
  # prepare-engine.sh, so they are cached under a key that moves when the script
  # or the lockfile moves; the unpacked Node source tree and its objects stay in
  # the runner's temp directory and are never cached.
  engine:
    name: engine (Node for iOS, harness)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Restore a staged engine
        id: staged
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Vendor
            app/ios/Engine/runtime
          key: ios-engine-${{ runner.os }}-${{ hashFiles('tooling/ios/prepare-engine.sh', 'pnpm-lock.yaml') }}
      - name: Build Node for iOS and deploy the harness
        if: steps.staged.outputs.cache-hit != 'true'
        env:
          NODE_BUILD_DIR: ${{ runner.temp }}/node-build
        run: |
          set -o pipefail
          tooling/ios/prepare-engine.sh 2>&1 | tee "$RUNNER_TEMP/engine.log"
      # The job log needs a sign-in to read; the step summary is on the run page
      # for anyone. An unproven cross-build fails for reasons the last screenful
      # of output names.
      - name: Leave the tail of a failed build on the run page
        if: failure() && steps.staged.outputs.cache-hit != 'true'
        run: |
          {
            echo '### the engine build failed'
            echo '```'
            tail -n 80 "$RUNNER_TEMP/engine.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ipa:
    name: unsigned ipa
    needs: engine
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Restore the staged engine
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Vendor
            app/ios/Engine/runtime
          key: ios-engine-${{ runner.os }}-${{ hashFiles('tooling/ios/prepare-engine.sh', 'pnpm-lock.yaml') }}
          fail-on-cache-miss: true
      - name: Build unsigned ipa
        run: tooling/ios/build.sh iphoneos "$RUNNER_TEMP/ipa"
      - name: Upload the ipa
        uses: actions/upload-artifact@v4
        with:
          name: dpsk-unsigned-ipa
          path: ${{ runner.temp }}/ipa/DPSK.ipa
          if-no-files-found: error
          retention-days: 14
