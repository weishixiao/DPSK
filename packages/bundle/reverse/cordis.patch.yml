# The dsh-reverse-bundle patch: the reverse-engineering capability as one layer
# over a base-backed profile. It only INSERTS rows of its own and rewrites none of
# the base's, so a profile keeps the stock chat, agent loop, tools, persistence and
# approval behaviour whether or not this bundle is selected.
#
# Capability switch, in two layers:
#   1. List this bundle in the profile's `dsh.profile.bundles`, or leave it out —
#      that is the whole capability's on and off.
#   2. Turn off one capability and keep the rest: give that row
#      `config: { enabled: false }`. The tools are then never registered, so the
#      model cannot call them and no approval prompt can appear for them. This is
#      the switch to use for "keep process and memory, drop the hook generator".
#
# The bridge's own `enabled` flag is a third thing: the rows stay mounted and every
# call is refused, which is an operator's kill switch rather than a capability
# choice.
#
# The resident side is a jailbreak tweak, not a package of this repository: the
# bridge only dials the socket the tweak listens on, so a device without the tweak
# reports `offline` and the tools say so rather than failing the composition.

- insert:
    - id: reverse-bridge
      name: '@deepseek-ai/dsh-reverse-bridge'
      config:
        enabled: true
        socketPath: /var/mobile/Library/DSHReverse/rvd.sock

    - id: tool-reverse-process
      name: '@deepseek-ai/dsh-tool-reverse-process'

    - id: tool-reverse-macho
      name: '@deepseek-ai/dsh-tool-reverse-macho'

    - id: tool-reverse-symbol
      name: '@deepseek-ai/dsh-tool-reverse-symbol'

    - id: tool-reverse-memory
      name: '@deepseek-ai/dsh-tool-reverse-memory'

    - id: tool-reverse-tweak
      name: '@deepseek-ai/dsh-tool-reverse-tweak'

    - id: tool-reverse-theos
      name: '@deepseek-ai/dsh-tool-reverse-theos'
      config:
        enabled: true
        # The device's own Theos: the build runs this make, in a project the user
        # names, and asks for approval first. A device without Theos reports the
        # spawn failure instead of pretending to compile.
        makePath: make
        theosRoot: /var/jb/opt/theos
        timeoutMs: 600000

    - id: reverse-scripts
      name: '@deepseek-ai/dsh-reverse-scripts'
